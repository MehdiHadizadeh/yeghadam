name: Release

# Push a tag that matches package.json, e.g. `git tag v2.0.0 && git push origin v2.0.0`.
# Required repository secrets:
#   KEYSTORE_BASE64     the PKCS#12 release keystore, base64-encoded
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the key alias
#   KEY_PASSWORD        the key password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm test
      - run: npm run build

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          YEGHADAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YEGHADAM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YEGHADAM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export YEGHADAM_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$YEGHADAM_KEYSTORE"' EXIT # also when the build fails
          echo "$KEYSTORE_BASE64" | base64 --decode > "$YEGHADAM_KEYSTORE"
          gradle -p android assembleRelease

      - name: Verify the signature and collect files
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          # The release key's certificate. A release signed with anything else (a debug key, a new key) must not ship:
          # installed apps could not update. Change this only together with a planned key rotation.
          cert="c6ae77c22b687e6b754b28f7d9de98b2e84779290a949f67749b7d536a4066fb"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signer.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $cert" signer.txt || { echo "the APK is not signed with the release key"; exit 1; }
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/yeghadam-$VERSION.apk"
          cp dist/userscript/yeghadam.user.js "out/yeghadam-$VERSION.user.js"
          (cd dist/extension && zip -r "../../out/yeghadam-extension-$VERSION.zip" .)
          (cd dist/extension-firefox && zip -r "../../out/yeghadam-extension-firefox-$VERSION.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Yeghadam ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
