name: Release

# Push a tag that matches package.json, e.g. `git tag v2.0.0 && git push origin v2.0.0`.
# Required repository secrets:
#   KEYSTORE_BASE64     the PKCS#12 release keystore, base64-encoded
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the key alias
#   KEY_PASSWORD        the key password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm test
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          YEGHADAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YEGHADAM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YEGHADAM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export YEGHADAM_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$YEGHADAM_KEYSTORE"
          gradle -p android assembleRelease
          rm -f "$YEGHADAM_KEYSTORE"

      - name: Verify the signature and collect files
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/yeghadam-$VERSION.apk"
          (cd dist/extension && zip -r "../../out/yeghadam-extension-$VERSION.zip" .)
          (cd out && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          name: Yeghadam ${{ env.VERSION }}
          generate_release_notes: true
          files: out/*
