version: 2
updates:
  # One pull request per month for all workflow updates, not one per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  # Android Gradle Plugin majors need a build migration of their own, so only minor and patch updates are proposed.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
