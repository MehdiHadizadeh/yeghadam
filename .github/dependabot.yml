version: 2
updates:
  # One pull request per month for all workflow updates, not one per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # The workflows pin each action to a commit; Dependabot moves the pin and its version comment together.
    # Major versions can change inputs and runtimes, so they are taken by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
  # Newer Android Gradle Plugin minors need a newer Gradle than the one the workflows install (8.9), and majors need a
  # build migration, so only patch updates are proposed. Bump AGP and the workflows' gradle-version together by hand.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      gradle:
        patterns: ["*"]
